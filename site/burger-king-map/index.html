#map{position:fixed;top:0;left:0;right:0;height:66.67vh;height:66.67dvh;background:#dfe6ea;touch-action:none}
#sheet{position:fixed;left:0;right:0;top:66.67vh;top:66.67dvh;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg);border-top:1px solid var(--line);
  padding:10px 14px calc(14px + env(safe-area-inset-bottom)) 14px;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
@media(min-width:760px){#map{right:380px;height:auto;bottom:0}#sheet{top:0;left:auto;width:380px;border-top:0;border-left:1px solid var(--line)}}
body.nomap #map{display:none}body.nomap #sheet{top:0}
h1{font-size:18px;margin:0 0 2px}.sub{color:var(--mut);font-size:14px;margin:0 0 8px}

.card{border-top:1px solid var(--line);padding:12px 2px}.card:first-of-type{border-top:0}
.head{display:flex;gap:12px;align-items:flex-start;cursor:pointer;min-height:44px}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--bk);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
.head b{display:block;font-size:16px}.head small{color:var(--mut);font-size:14px}.det{color:var(--acc);font-weight:600}
.ts{margin:8px 0 0 44px;padding:8px 10px;border-radius:10px;background:#fdf1f2;font-size:14px}.ts b{font-size:15px}.ts .m{color:var(--mut)}
.nav{display:flex;gap:8px;margin:8px 0 0 44px;flex-wrap:wrap}.ts .nav{margin-left:0}
.nav a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border:1px solid var(--acc);border-radius:10px;color:var(--acc);text-decoration:none;font-size:15px;font-weight:600;background:#fff}
.bn{width:34px;height:34px;border-radius:50%;background:var(--bk);color:#fff;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.55);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
.tsi svg{display:block;filter:drop-shadow(0 1px 3px rgba(0,0,0,.55))}
.leaflet-touch .leaflet-bar a{width:44px;height:44px;line-height:44px;font-size:22px}
.leaflet-popup-content{margin:12px 14px;font-size:15px}.leaflet-popup-content-wrapper{border-radius:12px}
.leaflet-container a.leaflet-popup-close-button{width:40px;height:40px;font-size:26px;line-height:40px;padding:0;text-align:center}
.pop b{font-size:16px}.pop .m{color:var(--mut);font-size:14px}
#loc{position:absolute;z-index:1000;top:10px;left:64px;min-height:44px;padding:0 14px;background:#fff;border:1px solid #bbb;border-radius:10px;font:600 15px system-ui,sans-serif;cursor:pointer}
.note{color:var(--mut);font-size:13px;margin:12px 0 0}
</style></head><body>
